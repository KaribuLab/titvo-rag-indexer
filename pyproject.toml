[project]
name = "titvo-rag-indexer"
version = "0.1.0"
description = "Servicio de indexación RAG de repositorios de código"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.59",
    "dynamodb-json>=1.4.2",
    "httpx>=0.28.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pycryptodome>=3.23.0",
    "sqlite-vec>=0.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.2",
]
