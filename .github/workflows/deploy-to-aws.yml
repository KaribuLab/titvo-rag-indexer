name: Deploy to AWS with Terragrunt

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  AWS_STAGE: prod
  ECR_REPOSITORY: tvo-rag-indexer-ecr-prod
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TITVO_BATCH_ROLE_TO_ASSUME }}
          aws-region: us-east-2

      - name: Apply ECR
        uses: gruntwork-io/terragrunt-action@v2
        with:
          tf_version: "1.9.8"
          tg_version: "0.69.1"
          tg_dir: "aws/ecr"
          tg_command: "apply --terragrunt-non-interactive -auto-approve"
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_TITVO_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Batch image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --tag "$image_uri" .

      - name: Push Batch image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "$image_uri"
          # terraform-aws-batch registra la job definition con ${repo}:latest
          docker tag "$image_uri" "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

      - name: Apply Terragrunt
        uses: gruntwork-io/terragrunt-action@v2
        with:
          tf_version: "1.9.8"
          tg_version: "0.69.1"
          tg_dir: "aws"
          tg_command: "run-all apply --terragrunt-non-interactive -auto-approve"
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_TITVO_ACCOUNT_ID }}

      - name: Verify IAM policy deployment
        run: |
          set -euo pipefail

          POLICY_ARN="arn:aws:iam::895649849416:policy/tvo-rag-indexer-batch-prod-job-policy"
          ROLE_NAME="karibulabs-github-actions-batch-role"
          SSM_BUCKET_PATH="/tvo/security-scan/${AWS_STAGE}/infra/s3/rag-index/bucket_arn"

          echo "==> Check A: IAM policy del role de Batch tiene las acciones S3 esperadas"

          DEFAULT_VERSION=$(aws iam get-policy \
            --policy-arn "$POLICY_ARN" \
            --query 'Policy.DefaultVersionId' \
            --output text)
          echo "  DefaultVersionId: $DEFAULT_VERSION"

          POLICY_DOC=$(aws iam get-policy-version \
            --policy-arn "$POLICY_ARN" \
            --version-id "$DEFAULT_VERSION" \
            --query 'PolicyVersion.Document' \
            --output json)

          REQUIRED_ACTIONS='["s3:GetObject","s3:PutObject","s3:CopyObject","s3:ListBucket","s3:DeleteObject"]'
          MISSING=$(echo "$POLICY_DOC" | jq -r --argjson req "$REQUIRED_ACTIONS" '
            [.Statement[] | select(.Effect == "Allow")
             | (.Action | if type == "array" then . else [.] end) as $a
             | $req[] | select(. as $r | $a | index($r) | not)] | unique | .[]')

          if [ -n "$MISSING" ]; then
            echo "::error::Faltan acciones S3 en el IAM policy desplegado:"
            echo "$MISSING" | sed 's/^/  - /'
            exit 1
          fi

          # Resource cross-check via SSM (best-effort, no falla si no hay permiso)
          EXPECTED_BUCKET=""
          if EXPECTED_BUCKET=$(aws ssm get-parameter \
            --name "$SSM_BUCKET_PATH" \
            --region "$AWS_REGION" \
            --query 'Parameter.Value' \
            --output text 2>/dev/null); then
            echo "  Bucket esperado (SSM): $EXPECTED_BUCKET"
            if ! echo "$POLICY_DOC" | jq -e --arg b "$EXPECTED_BUCKET" \
              '[.Statement[] | select(.Effect == "Allow")
               | (.Resource | if type == "array" then . else [.] end)[]
               | select(. == $b)] | length > 0' > /dev/null; then
              echo "::error::El bucket $EXPECTED_BUCKET no aparece como Resource en el IAM policy"
              exit 1
            fi
          else
            echo "  ::warning::No se pudo leer $SSM_BUCKET_PATH (probable falta de ssm:GetParameter en el rol OIDC)."
            echo "  ::warning::Si querés validación estricta del Resource, agrega ssm:GetParameter al rol OIDC."
            echo "  ::warning::Saltando el cross-check de Resource; las acciones S3 ya fueron validadas."
          fi

          echo "  ✓ Check A passed"

          echo ""
          echo "==> Check B: el rol OIDC puede ejecutar iam:CreatePolicyVersion"

          DECISION=$(aws iam simulate-principal-policy \
            --policy-source-arn "arn:aws:iam::895649849416:role/$ROLE_NAME" \
            --action-names "iam:CreatePolicyVersion" \
            --resource-arns "$POLICY_ARN" \
            --query 'EvaluationResults[0].EvalDecision' \
            --output text 2>&1) || DECISION="error"

          if [ "$DECISION" != "allowed" ]; then
            echo "::error::El rol OIDC $ROLE_NAME no puede ejecutar iam:CreatePolicyVersion"
            echo "  Decisión de AWS: $DECISION"
            echo "  Fix: agregar iam:CreatePolicyVersion al rol en el módulo de infra compartida."
            exit 1
          fi

          echo "  ✓ Check B passed"
          echo ""
          echo "Post-deploy verification passed."